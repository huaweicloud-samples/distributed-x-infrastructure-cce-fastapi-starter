apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  password: <DB_PASSWORD>
---
apiVersion: v1
kind: Secret
metadata:
  name: auth0-credentials
type: Opaque
stringData:
  client-secret: <AUTH0_CLIENT_SECRET>
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  secret-key: <APP_SECRET_KEY>
